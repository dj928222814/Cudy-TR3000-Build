name: Build Cudy TR3000 (25.12 - SSH Interactive)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space & Setup Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools rsync unzip \
          zlib1g-dev file wget subversion swig time libelf-dev
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Clone ImmortalWrt 25.12 Source
      run: |
        git clone -b openwrt-25.12 --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt

    - name: Add iStore Plugin & Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # 拉取官方 iStore 及其前端依赖
        git clone --depth=1 https://github.com/linkease/istore.git package/istore
        git clone --depth=1 https://github.com/linkease/istore-ui.git package/istore-ui
        ./scripts/feeds install -a

    # 启动交互式 SSH / Web 终端
    - name: Setup SSH / Web Terminal (tmate)
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 60

    - name: Download package source
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Cudy-TR3000-ImmortalWrt-25.12-Custom
        path: |
          openwrt/bin/targets/mediatek/mt7981/*sysupgrade.bin
          openwrt/bin/targets/mediatek/mt7981/*initramfs*
