name: Build Cudy TR3000 Interactive Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /crystal /etc/mysql /etc/php
        sudo apt-get -y update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged lzma lksctp-tools zlib1g-dev libc6-dev-i386 libelf-dev libglib2.0-dev libnotify-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano ninja-build p7zip p7zip-full patch pkg-config python3 python3-pip python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip nodejs vim wget xmlto xz-utils zlib1g-dev
        sudo apt-get -y autoremove --purge
        sudo apt-get -y clean

    - name: Clone source code
      run: |
        git clone -b openwrt-24.10 https://github.com openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        echo "src-git kenzo https://github.com" >> feeds.conf.default
        echo "src-git qmodem https://github.com" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 【核心安全机制】启动远程交互
    - name: Setup tmate session for Custom Web Config
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 30
